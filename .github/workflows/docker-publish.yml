# The public image on Docker Hub (zardkim/muzplayer), built when a version tag (v1.2.3) is pushed
# to GitHub, or by hand (Actions → Run workflow). Needs the repository secrets DOCKERHUB_USERNAME
# and DOCKERHUB_TOKEN (a Docker Hub access token with Read & Write).
# Only on github.com: a Gitea copy of this repository reads .github/workflows too, and must not run it.
name: Docker image

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      version:
        description: "Version to build and tag (e.g. 0.69.1)"
        required: true

jobs:
  publish:
    if: github.server_url == 'https://github.com'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - name: Version
        id: v
        run: |
          if [ -n "${{ github.event.inputs.version }}" ]; then V="${{ github.event.inputs.version }}"; else V="${GITHUB_REF_NAME#v}"; fi
          echo "version=$V" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - uses: docker/setup-qemu-action@v3  # arm64 (Raspberry Pi, ARM NAS) built under emulation

      - uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          build-args: APP_VERSION=${{ steps.v.outputs.version }}
          tags: |
            zardkim/muzplayer:${{ steps.v.outputs.version }}
            zardkim/muzplayer:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max
