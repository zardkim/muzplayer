<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#FFFFFF" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="muzplayer" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <!-- iPhone (180), iPad Pro (167), iPad (152): iOS rounds the corners itself. iOS takes the icon
         once, on "Add to Home Screen": with the phone in dark mode then, the dark one (below) -->
    <link rel="apple-touch-icon" href="/icon-180.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="/icon-180.png" />
    <link rel="apple-touch-icon" sizes="167x167" href="/icon-167.png" />
    <link rel="apple-touch-icon" sizes="152x152" href="/icon-152.png" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;700&display=swap" rel="stylesheet" />
    <title>muzplayer</title>
    <script>
      // the colour theme picked in Settings (stores/ui.ts), applied before the first paint
      try {
        var theme = JSON.parse(localStorage.getItem('muz.ui') || '{}').theme
        var bars = { plexamp: '#CBC5BF', spotify: '#121212', melon: '#FFFFFF' }
        if (bars[theme]) {
          document.documentElement.dataset.theme = theme
          document.querySelector('meta[name="theme-color"]').setAttribute('content', bars[theme])
        }
      } catch (e) {}
      // the home screen icon picked in Settings (stores/ui.ts appIcon), taken when the app is added
      // to the home screen. auto: the phone's light or dark mode at that time (iPhone; Android's own
      // themed icons use the monochrome one).
      var dark = window.matchMedia && matchMedia('(prefers-color-scheme: dark)')
      var iconChoice = 'auto'
      window.muzAppIcon = function (choice) {
        iconChoice = choice || 'auto'
        var v = iconChoice === 'auto' ? (dark && dark.matches ? 'dark' : 'light') : iconChoice
        document.querySelectorAll('link[rel="apple-touch-icon"]').forEach(function (l) {
          l.href = l.getAttribute('href').replace(/icon-((dark|pink|navy)-)?/, v === 'light' ? 'icon-' : 'icon-' + v + '-')
        })
        document.querySelector('link[rel="manifest"]').href = iconChoice === 'auto' || v === 'light' ? '/manifest.webmanifest' : '/manifest-' + v + '.webmanifest'
      }
      // (the server has written the one picked into the links already: cookie muz_icon, backend main.py)
      var iconCookie = (document.cookie.match(/(?:^|; )muz_icon=(\w+)/) || [])[1]
      try {
        window.muzAppIcon(JSON.parse(localStorage.getItem('muz.ui') || '{}').appIcon || iconCookie)
      } catch (e) {
        window.muzAppIcon(iconCookie)
      }
      if (dark && dark.addEventListener) dark.addEventListener('change', function () { window.muzAppIcon(iconChoice) })
    </script>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
