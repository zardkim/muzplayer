# muzplayer — do not edit this file on the NAS. Change values in .env only.
name: muzplayer

services:
  app:
    image: harbor.nurilab.pe.kr/muzplayer/muzplayer:${MUZPLAYER_VERSION:-latest}
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "${HTTP_PORT:-8580}:8000"
    environment:
      DATABASE_URL: postgresql+psycopg://muzplayer:${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}@db:5432/muzplayer
      DEFAULT_LOCALE: ${DEFAULT_LOCALE:-ko}
      COOKIE_SECURE: ${COOKIE_SECURE:-true}
      SESSION_DAYS: ${SESSION_DAYS:-30}
      ADMIN_USERNAME: ${ADMIN_USERNAME:-}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-}
      PUID: ${PUID:-1000}
      PGID: ${PGID:-1000}
      TZ: ${TZ:-Asia/Seoul}
    volumes:
      - ${MUSIC_PATH:?set MUSIC_PATH in .env}:/music:ro
      - ${DATA_PATH:-./data}/app:/data

  db:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: muzplayer
      POSTGRES_DB: muzplayer
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      TZ: ${TZ:-Asia/Seoul}
    command: ["postgres", "-c", "shared_buffers=128MB", "-c", "max_connections=30"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U muzplayer -d muzplayer"]
      interval: 5s
      timeout: 5s
      retries: 20
    volumes:
      - ${DATA_PATH:-./data}/postgres:/var/lib/postgresql/data
    # no ports: the database is reachable only from the app container
