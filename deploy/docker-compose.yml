# muzplayer — do not edit this file on the NAS. Change values in .env (or Portainer's stack variables) only.
#
# Everything lives under MUZPLAYER_DIR (an absolute path, e.g. /volume1/docker/muzplayer):
#   app/                album-art cache and other app data
#   db/                 the database
#   conf/               settings changed in the app (API keys)
#   library/music/      the music library (mount it here yourself, then restart the app)
#   library/audiobook/  audiobooks (optional; empty or missing = audiobooks off)
#   library/video/      music videos (optional; registered on the Music videos page)
#   library/music/cover music/  songs taken out of music videos (the only folder the app writes in the library)
# app, db, conf and library are created on the first start.
# Absolute on purpose: Portainer runs stacks from its own folder, where ./app would not be yours.
name: muzplayer

services:
  app:
    image: harbor.nurilab.pe.kr/muzplayer/muzplayer:${MUZPLAYER_VERSION:-latest}
    # fixed name: after mounting library/music, `docker restart muzplayer` (Portainer or not)
    container_name: muzplayer
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "${HTTP_PORT:-18150}:8000"
    environment:
      DATABASE_URL: postgresql+psycopg://muzplayer:${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}@db:5432/muzplayer
      DEFAULT_LOCALE: ${DEFAULT_LOCALE:-ko}
      COOKIE_SECURE: ${COOKIE_SECURE:-true}
      SESSION_DAYS: ${SESSION_DAYS:-60}
      SCAN_INTERVAL_MINUTES: ${SCAN_INTERVAL_MINUTES:-60}
      TRANSCODE_CACHE_MB: ${TRANSCODE_CACHE_MB:-2048}
      FFMPEG_PATH: ${FFMPEG_PATH:-}
      PUID: ${PUID:-1000}
      PGID: ${PGID:-1000}
      TZ: ${TZ:-Asia/Seoul}
    volumes:
      - ${MUZPLAYER_DIR:?set MUZPLAYER_DIR in .env}/app:/data
      - ${MUZPLAYER_DIR:?set MUZPLAYER_DIR in .env}/conf:/conf
      # read-only. No mount options here: with one, some Compose versions stop creating a missing folder
      - ${MUZPLAYER_DIR:?set MUZPLAYER_DIR in .env}/library:/library:ro
      # the one folder the app writes in the library: songs taken out of music videos (Music videos →
      # ⋮ → Extract audio): cover music/<artist>/<disc>-<track> <title>.m4a
      - "${MUZPLAYER_DIR:?set MUZPLAYER_DIR in .env}/library/music/cover music:/library/music/cover music"

  db:
    image: postgres:17-alpine
    container_name: muzplayer-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: muzplayer
      POSTGRES_DB: muzplayer
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      TZ: ${TZ:-Asia/Seoul}
    command: ["postgres", "-c", "shared_buffers=128MB", "-c", "max_connections=30"]
    healthcheck:
      # over TCP: the temporary server of the first start (socket only) must not count as ready
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U muzplayer -d muzplayer"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 60s
    volumes:
      - ${MUZPLAYER_DIR:?set MUZPLAYER_DIR in .env}/db:/var/lib/postgresql/data
    # no ports: the database is reachable only from the app container
