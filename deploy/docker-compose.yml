# muzplayer — do not edit this file on the NAS. Change values in .env only.
name: muzplayer

services:
  app:
    image: harbor.nurilab.pe.kr/muzplayer/muzplayer:${MUZPLAYER_VERSION:-latest}
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "${HTTP_PORT:-8580}:8000"
    environment:
      DATABASE_URL: postgresql+psycopg://muzplayer:${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}@db:5432/muzplayer
      DEFAULT_LOCALE: ${DEFAULT_LOCALE:-ko}
      COOKIE_SECURE: ${COOKIE_SECURE:-true}
      SESSION_DAYS: ${SESSION_DAYS:-30}
      SCAN_INTERVAL_MINUTES: ${SCAN_INTERVAL_MINUTES:-60}
      # the library is mounted at the same path as on the NAS so absolute symlinks resolve
      MUSIC_DIR: ${MUSIC_PATH:?set MUSIC_PATH in .env}
      # empty = audiobooks off
      AUDIOBOOK_DIR: ${AUDIOBOOK_PATH:-}
      # AI banners for charts/themes; no key = the AI buttons are hidden
      AI_PROVIDER: ${AI_PROVIDER:-gemini}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      GEMINI_IMAGE_MODEL: ${GEMINI_IMAGE_MODEL:-}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      OPENAI_IMAGE_MODEL: ${OPENAI_IMAGE_MODEL:-}
      YOUTUBE_API_KEY: ${YOUTUBE_API_KEY:-}
      ADMIN_USERNAME: ${ADMIN_USERNAME:-}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-}
      PUID: ${PUID:-1000}
      PGID: ${PGID:-1000}
      TZ: ${TZ:-Asia/Seoul}
    volumes:
      - type: bind
        source: ${MUSIC_ROOT:?set MUSIC_ROOT in .env}
        target: ${MUSIC_ROOT:?set MUSIC_ROOT in .env}
        read_only: true
        bind:
          # a mistyped path must stop the start, not become a new empty folder on the NAS
          create_host_path: false
          # rslave: shares mounted into the library after start show up without a restart
          propagation: ${MUSIC_MOUNT_PROPAGATION:-rprivate}
      - ${DATA_PATH:-./data}/app:/data
      # audiobooks, read-only at the same path; without AUDIOBOOK_PATH this folder stands in (unused)
      - type: bind
        source: ${AUDIOBOOK_PATH:-.}
        target: ${AUDIOBOOK_PATH:-/no-audiobooks}
        read_only: true
        bind:
          create_host_path: false

  db:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: muzplayer
      POSTGRES_DB: muzplayer
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      TZ: ${TZ:-Asia/Seoul}
    command: ["postgres", "-c", "shared_buffers=128MB", "-c", "max_connections=30"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U muzplayer -d muzplayer"]
      interval: 5s
      timeout: 5s
      retries: 20
    volumes:
      - ${DATA_PATH:-./data}/postgres:/var/lib/postgresql/data
    # no ports: the database is reachable only from the app container
