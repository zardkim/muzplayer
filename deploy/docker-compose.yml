# muzplayer — do not edit this file on the NAS. Change values in .env only.
#
# Put this file and .env in a muzplayer folder; the rest sits next to them:
#   muzplayer/app        album-art cache and other app data
#   muzplayer/db         the database
#   muzplayer/conf       settings changed in the app (API keys)
#   muzplayer/library/music       the music library (mount or copy it here yourself)
#   muzplayer/library/audiobook   audiobooks (optional; empty or missing = audiobooks off)
# app, db, conf and library are created on the first start.
name: muzplayer

services:
  app:
    image: harbor.nurilab.pe.kr/muzplayer/muzplayer:${MUZPLAYER_VERSION:-latest}
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "${HTTP_PORT:-18150}:8000"
    environment:
      DATABASE_URL: postgresql+psycopg://muzplayer:${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}@db:5432/muzplayer
      DEFAULT_LOCALE: ${DEFAULT_LOCALE:-ko}
      COOKIE_SECURE: ${COOKIE_SECURE:-true}
      SESSION_DAYS: ${SESSION_DAYS:-30}
      SCAN_INTERVAL_MINUTES: ${SCAN_INTERVAL_MINUTES:-60}
      PUID: ${PUID:-1000}
      PGID: ${PGID:-1000}
      TZ: ${TZ:-Asia/Seoul}
    volumes:
      - ./app:/data
      - ./conf:/conf
      - type: bind
        source: ./library
        target: /library
        read_only: true
        bind:
          # made empty on the first start; music/ and audiobook/ inside are mounted by you
          create_host_path: true
          # rslave: shares mounted into library/ after start show up without a restart
          propagation: ${MUSIC_MOUNT_PROPAGATION:-rprivate}

  db:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: muzplayer
      POSTGRES_DB: muzplayer
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      TZ: ${TZ:-Asia/Seoul}
    command: ["postgres", "-c", "shared_buffers=128MB", "-c", "max_connections=30"]
    healthcheck:
      # over TCP: the temporary server of the first start (socket only) must not count as ready
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U muzplayer -d muzplayer"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 60s
    volumes:
      - ./db:/var/lib/postgresql/data
    # no ports: the database is reachable only from the app container
